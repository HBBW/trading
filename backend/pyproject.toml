[project]
name = "idx-swing-backend"
version = "0.1.0"
description = "IDX swing screener backend: EOD + intraday scan, pluggable data provider"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "yfinance>=0.2.40",
    "pandas>=2.1",
    "numpy>=1.26",
    "duckdb>=1.0",
    "apscheduler>=3.10,<4",
    "pydantic-settings>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
